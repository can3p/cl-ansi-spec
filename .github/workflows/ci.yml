name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    # Pinned so the apt-provided SBCL version only changes deliberately.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Install SBCL
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sbcl && sbcl --version

      - name: Cache pinned dependencies
        uses: actions/cache@v4
        with:
          path: .deps
          key: deps-${{ hashFiles('tools/deps.sexp') }}

      - name: Verify pristine spec and vendored sources
        run: |
          (cd spec/tex && sha256sum --quiet -c ../SHA256SUMS)
          (cd vendor/plain && sha256sum --quiet -c ../SHA256SUMS)

      - name: Build and test
        run: make test
